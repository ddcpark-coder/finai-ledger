name: FinAI navigation checks

on:
  pull_request:
    paths:
      - "app/modules/contextRoute.mjs"
      - "app/modules/contextNavigation.js"
      - "app/modules/moduleRegistry.js"
      - "tests/contextRoute.test.mjs"
      - ".github/workflows/navigation-tests.yml"
  push:
    branches: [main]
    paths:
      - "app/modules/contextRoute.mjs"
      - "app/modules/contextNavigation.js"
      - "app/modules/moduleRegistry.js"
      - "tests/contextRoute.test.mjs"
      - ".github/workflows/navigation-tests.yml"

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deep links and favorite routes
        run: node --test tests/contextRoute.test.mjs
