name: FinAI liquidity scenario focused QA
on:
  pull_request:
    paths:
      - "app/banking/CashflowScenarioPanel.jsx"
      - "app/banking/cashFlowScenario.mjs"
      - "app/banking/BankingWorkspace.jsx"
      - "tests/cashFlowScenario.test.mjs"
      - "tests/e2e/cashflow-scenario.spec.cjs"
      - ".github/workflows/cashflow-scenarios-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cashflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit: exact synthetic cash scenario arithmetic
        run: node --test tests/cashFlowScenario.test.mjs
      - name: Build and prepare mobile/desktop preview
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm install --no-save --no-audit --no-fund --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Serve static synthetic app
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /tmp/finai-cashflow.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser: scenarios, period and company isolation
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/cashflow-scenario.spec.cjs
      - name: Failure trace only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finai-cashflow-scenario-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
