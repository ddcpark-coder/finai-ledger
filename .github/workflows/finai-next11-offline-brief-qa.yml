name: FinAI NEXT11 offline Windows and mobile BI preview QA
on:
  pull_request:
    paths:
      - "app/next11/**"
      - "app/field/page.jsx"
      - "app/offline/page.jsx"
      - "tests/next11CompactBrief.test.mjs"
      - ".github/workflows/finai-next11-offline-brief-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify business unit metrics and tenant-isolated offline brief
        run: node --test tests/next11CompactBrief.test.mjs
