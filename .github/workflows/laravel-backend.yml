name: FinAI Laravel foundation tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/laravel-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, xml, dom, curl, sqlite3, pdo_sqlite, openssl, fileinfo
          tools: composer:v2
      - name: Validate read-only hosting audit script
        run: |
          bash -n scripts/hiperm-readonly-check.sh
          bash scripts/hiperm-readonly-check.sh
      - name: Verify BACKEND-04 scaffold without touching hosting
        run: |
          bash -n scripts/finai-backend04-scaffold.sh
          safe_home="$(mktemp -d)"
          trap 'rm -rf "$safe_home"' EXIT
          HOME="$safe_home" bash scripts/finai-backend04-scaffold.sh --dry-run
          test ! -e "$safe_home/apps/finai-ledger"
          HOME="$safe_home" bash scripts/finai-backend04-scaffold.sh --apply
          test -d "$safe_home/apps/finai-ledger/releases"
          test -d "$safe_home/apps/finai-ledger/shared/storage/app/private"
          test -d "$safe_home/apps/finai-ledger/shared/storage/framework/sessions"
          test ! -e "$safe_home/apps/finai-ledger/current"
          if HOME="$safe_home" bash scripts/finai-backend04-scaffold.sh --apply; then
            echo "Expected an existing-root refusal" >&2
            exit 1
          fi
      - name: Validate Composer project
        run: composer validate --strict --no-check-publish
      - name: Install reviewed dependencies without secrets
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check locked package security advisories
        run: composer audit --locked --no-interaction
      - name: Prepare isolated test environment
        run: cp .env.example .env
      - name: Check application can bootstrap
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          php artisan --version
          php artisan route:list --path=api
          php artisan finai:preflight
      - name: Run isolated tenant/API integration tests
        run: php artisan test --testsuite=Feature --display-warnings --no-ansi --stop-on-failure
