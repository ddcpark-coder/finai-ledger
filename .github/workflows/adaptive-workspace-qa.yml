name: FinAI adaptive workspace targeted QA
on:
  pull_request:
    paths:
      - "app/components/AdaptiveWorkspace.jsx"
      - "app/hooks/useAdaptiveWorkspace.js"
      - "app/lib/workspacePersonalization.mjs"
      - "app/page.jsx"
      - "tests/workspacePersonalization.test.mjs"
      - "tests/e2e/adaptive-workspace.spec.cjs"
      - ".github/workflows/adaptive-workspace-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adaptive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused view preference unit tests
        run: node --test tests/workspacePersonalization.test.mjs
      - name: Install app and pinned test runner
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm install --no-save --no-audit --no-fund --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Serve synthetic local export
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /tmp/finai-adaptive.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify local personalization with desktop and mobile
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/adaptive-workspace.spec.cjs
      - name: Save failure trace only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finai-adaptive-qa-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
