name: FinAI dedicated Windows key bootstrap QA

on:
  pull_request:
    paths:
      - 'ops/finai-isolated-windows-setup.ps1'
      - 'ops/finai-isolated-bootstrap.sh'
      - 'tests/test_finai_isolated_bootstrap.py'
      - 'tests/finai_fake_gh.cs'
      - 'tests/test_finai_dedicated_windows_setup.ps1'
      - '.github/workflows/finai-dedicated-bootstrap-qa.yml'
  push:
    branches: [main]
    paths:
      - 'ops/finai-isolated-windows-setup.ps1'
      - 'ops/finai-isolated-bootstrap.sh'
      - 'tests/test_finai_isolated_bootstrap.py'
      - 'tests/finai_fake_gh.cs'
      - 'tests/test_finai_dedicated_windows_setup.ps1'
      - '.github/workflows/finai-dedicated-bootstrap-qa.yml'

permissions:
  contents: read

jobs:
  linux-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check owner, mode and symlink handling
        run: |
          bash -n ops/finai-isolated-bootstrap.sh
          python3 -B -m unittest discover -s tests -p 'test_finai_isolated_bootstrap.py' -v

  windows-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable key and reject non-FinAI host
        shell: powershell
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ops/finai-isolated-windows-setup.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'PowerShell syntax failed.' }
          & ./ops/finai-isolated-windows-setup.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap self-test failed.' }
      - name: Exercise GitHub setup with disposable local CLI
        shell: powershell
        run: ./tests/test_finai_dedicated_windows_setup.ps1
