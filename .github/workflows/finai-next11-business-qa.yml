name: FinAI NEXT11 business intelligence and CRM synthetic QA
on:
  pull_request:
    paths:
      - "app/next11/**"
      - "app/page.jsx"
      - "app/crm/CrmWorkspace.jsx"
      - "tests/next11BusinessModel.test.mjs"
      - ".github/workflows/finai-next11-business-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check synthetic company isolation and analytics/CRM mathematics
        run: node --test tests/next11BusinessModel.test.mjs
