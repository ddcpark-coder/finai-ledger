name: FinAI NEXT35 CRM 360 tenant-safe quote-to-order QA
on:
  pull_request:
    paths:
      - "app/crm/**"
      - "app/quotes/QuotesWorkspace.jsx"
      - "app/orders/SalesOrdersWorkspace.jsx"
      - "tests/next35Crm360Session.test.mjs"
      - "tests/e2e/next35-crm360.spec.cjs"
      - ".github/workflows/finai-next35-crm360-qa.yml"
permissions:
  contents: read
jobs:
  crm360:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate tenant-scoped contacts, activities, quote and order drafts
        run: node --test tests/next35Crm360Session.test.mjs tests/sharedDemoCompany.test.mjs
      - name: Install app and isolated browser QA
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm install --no-save --no-audit --no-fund --package-lock=false @playwright/test@1.56.1
          npx playwright install chromium
      - name: Build browser-only synthetic app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          test -s out/index.html
      - name: Serve in runner loopback only
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /tmp/finai-next35-browser.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test CRM customer to approved quote and draft order in desktop/mobile
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/next35-crm360.spec.cjs --project=desktop-chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: finai-next35-crm360-focused-errors
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
