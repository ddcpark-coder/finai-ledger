name: FinAI bank matching synthetic QA
on:
  pull_request:
    paths:
      - "app/banking/**"
      - "app/page.jsx"
      - "tests/bankMatching.test.mjs"
      - "tests/cashFlowScenario.test.mjs"
      - "tests/e2e/cashflow-scenario.spec.cjs"
      - "tests/e2e/bank-reconcile.spec.cjs"
      - ".github/workflows/bank-reconcile-demo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deterministic tenant-scoped matching
        run: node --test tests/bankMatching.test.mjs tests/cashFlowScenario.test.mjs
      - name: Build web and install pinned browser runner
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm install --no-save --no-audit --no-fund --package-lock=false @playwright/test@1.56.1
          npx playwright install chromium
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Serve synthetic local preview
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /tmp/finai-bank.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test tenant isolation and matching on desktop/mobile only
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/bank-reconcile.spec.cjs tests/e2e/cashflow-scenario.spec.cjs
      - name: Save failures only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finai-bank-demo-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
