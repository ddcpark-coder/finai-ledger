name: FinAI Windows offline installer (synthetic QA only)

on:
  pull_request:
    paths:
      - ".github/workflows/finai-windows-installer-qa.yml"
      - "desktop/windows/FinAI.iss"
      - "desktop/windows/OfflineInstallerUpgradeQa.cs"
      - "desktop/windows/Program.cs"
      - "desktop/windows/EIntegrator.Desktop.csproj"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-installer:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build only synthetic standalone static UI
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic static build failed' }
          if (-not (Test-Path out/offline/index.html)) {
            throw 'Missing required offline app entry'
          }

      - name: Build self-contained win-x64 native application
        shell: pwsh
        run: |
          dotnet restore desktop/windows/EIntegrator.Desktop.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime restore failed' }
          dotnet publish desktop/windows/EIntegrator.Desktop.csproj --no-restore -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable build failed' }
          New-Item -ItemType Directory -Force dist/windows/wwwroot | Out-Null
          Copy-Item -Path out/* -Destination dist/windows/wwwroot -Recurse -Force
          if (-not (Test-Path dist/windows/wwwroot/offline/index.html)) {
            throw 'Standalone Windows UI is incomplete'
          }
          & dist/windows/EIntegrator.Desktop.exe --synthetic-order-draft-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted native order/session/tenant/recovery QA failed' }
          & dist/windows/EIntegrator.Desktop.exe --ledger-recovery-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted portable database recovery QA failed' }
          Write-Output 'FINAI_WINDOWS_INSTALLER_CRITICAL_OFFLINE_QA=PASS'

      - name: Download Microsoft full offline WebView2 installer and check signature
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force buildtools | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile 'buildtools/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $file = Get-Item 'buildtools/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          if ($file.Length -lt 15000000) { throw 'Offline runtime file is too small' }
          $sign = Get-AuthenticodeSignature $file.FullName
          if ($sign.Status -ne 'Valid' -or
              $sign.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft offline WebView2 signature was not verified'
          }
          Write-Output 'FINAI_SIGNED_MICROSOFT_WEBVIEW2_OFFLINE_RUNTIME=PASS'

      - name: Create unsigned synthetic QA installer using Inno Setup
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $pf64 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFiles)
          $locations = @(
            (Join-Path $pf86 'Inno Setup 6\ISCC.exe'),
            (Join-Path $pf64 'Inno Setup 6\ISCC.exe')
          )
          $compiler = $locations | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Isolated runner Inno Setup install failed' }
            $compiler = $locations | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Inno Setup compiler not available' }
          & $compiler 'desktop/windows/FinAI.iss'
          if ($LASTEXITCODE -ne 0) { throw 'QA installer compilation failed' }
          $installer = Get-Item 'dist/installer/e-integrator-desktop-offline-setup-win-x64-unsigned.exe'
          if ($installer.Length -lt 20000000) {
            throw 'Offline setup missing self-contained binaries or WebView2 runtime'
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Write-Output "FINAI_UNSIGNED_SYNTHETIC_INSTALLER_SHA256=$hash"
          Write-Output 'FINAI_WINDOWS_OFFLINE_QA_INSTALLER=PASS'

      - name: Reinstall offline QA application and verify encrypted vault survived
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:CI -ne 'true' -or
              -not (Test-Path $env:RUNNER_TEMP)) {
            throw 'Isolated GitHub Actions upgrade QA required'
          }
          $installer = (Resolve-Path 'dist/installer/e-integrator-desktop-offline-setup-win-x64-unsigned.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'finai-isolated-upgrade-installed'
          if (Test-Path $target) { throw 'Upgrade QA destination already exists' }
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $target + '"'))
          $first = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw "Offline QA setup failed $($first.ExitCode)" }
          $installedExe = Join-Path $target 'EIntegrator.Desktop.exe'
          if (-not (Test-Path $installedExe) -or
              -not (Test-Path (Join-Path $target 'wwwroot/offline/index.html'))) {
            throw 'Installed offline Windows app is incomplete'
          }
          & $installedExe --qa-installer-seed
          if ($LASTEXITCODE -ne 0) { throw "Synthetic encrypted upgrade fixture creation failed (category $LASTEXITCODE)" }
          $second = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($second.ExitCode -ne 0) { throw "Offline reinstall failed $($second.ExitCode)" }
          & $installedExe --qa-installer-verify
          if ($LASTEXITCODE -ne 0) {
            throw "Encrypted company/order/backup data changed during reinstall: $LASTEXITCODE"
          }
          Write-Output 'FINAI_WINDOWS_REINSTALL_ENCRYPTED_VAULT_PRESERVED=PASS'
          Write-Output 'FINAI_OFFLINE_REINSTALL_WITHOUT_DATA_RESET=PASS'

      - name: Store unsigned QA installer for internal review only
        uses: actions/upload-artifact@v4
        with:
          name: finai-next13d-win-x64-offline-qa-unsigned
          path: dist/installer/e-integrator-desktop-offline-setup-win-x64-unsigned.exe
          retention-days: 7
          if-no-files-found: error
