name: FinAI NEXT11 multibranch and commerce synthetic QA
on:
  pull_request:
    paths:
      - "app/next11/**"
      - "app/modules/moduleRegistry.js"
      - "app/modules/contextNavigation.js"
      - "app/page.jsx"
      - "tests/next11Operations.test.mjs"
      - "tests/syntheticCommerceReviewClient.test.mjs"
      - ".github/workflows/finai-next11-operations-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify stock conservation, tenant scope and shop staging
        run: node --test tests/next11Operations.test.mjs tests/contextRoute.test.mjs tests/syntheticCommerceReviewClient.test.mjs
      - name: Compile standalone synthetic Integracije user interface
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          test -s out/index.html
