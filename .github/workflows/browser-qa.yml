name: FinAI desktop/mobile interaction QA

on:
  pull_request:
    paths:
      # Full desktop/mobile scenarios only for interaction-sensitive changes.
      # Styling and routine page edits get the static build + integrity check instead.
      - "app/auth/**"
      - "app/issued/**"
      - "app/business/**"
      - "app/tasks/**"
      - "tests/demoTaskCenter.test.mjs"
      - "app/integrations/**"
      - "app/orders/**"
      - "tests/cmsOrderAdapter.test.mjs"
      - "tests/demoCommercialFlow.test.mjs"
      - "app/modules/contextNavigation.js"
      - "app/modules/contextRoute.mjs"
      - "app/modules/moduleRegistry.js"
      - "next.config.mjs"
      - "tests/e2e/**"
      - "playwright.config.cjs"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app and pinned test runner (no secrets)
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm install --no-save --no-audit --no-fund --package-lock=false @playwright/test@1.56.1
      - name: Focused synthetic invoice calculation and state tests
        run: npm run test:issued-demo && node --test tests/demoCommercialFlow.test.mjs && node --test tests/cmsOrderAdapter.test.mjs && node --test tests/demoTaskCenter.test.mjs
      - name: Install Chromium for desktop and mobile emulation
        run: npx playwright install --with-deps chromium
      - name: Build Next.js
        run: npm run build
      - name: Verify portable Hiper M static build
        run: |
          test -f out/index.html
          test -d out/_next
          echo 'HIPERM_FRONTEND_STATIC_EXPORT=PASS'
      - name: Serve static export (no Next.js production runtime)
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /tmp/finai-static.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/finai-static.log
          exit 1
      - name: Run 2-device interaction scenarios
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test
      - name: Publish screenshot previews for visual feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finai-visual-qa-desktop-mobile
          path: test-results/visual-qa/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Publish failure artifacts (screenshots and traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failures
          path: |
            test-results/
            /tmp/finai-static.log
          retention-days: 7
