name: FinAI private API staging safeguards

on:
  pull_request:
    paths:
      - 'ops/finai-api-private-stage.py'
      - 'ops/finai-api-private-extract.py'
      - 'ops/finai-api-web-php-probe.py'
      - 'tests/test_finai_api_private_stage.py'
      - 'tests/test_finai_api_private_extract.py'
      - 'tests/test_finai_api_web_php_probe.py'
      - '.github/workflows/finai-api-private-stage-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-stage-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, xml, dom, curl, pdo_mysql
      - name: Verify private staging and extraction with synthetic artifacts
        run: python3 -B -m unittest discover -s tests -p 'test_finai_api_private_*.py' -v
      - name: Verify temporary web PHP probe safeguards
        run: python3 -B -m unittest discover -s tests -p 'test_finai_api_web_php_probe.py' -v
